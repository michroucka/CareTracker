server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Security headers for the app itself; the API gets its own from Spring Security.
    # CSP: scripts only from the app itself. Styles allow inline <style> that libraries insert at runtime
    # (toasts, scroll lock), hashes would break with every dependency update. Google Fonts; Mapy.com tiles
    # and logo; maplibre workers from blob:; photos, QR codes and the printed receipt as blob: URLs.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.mapy.com; connect-src 'self' https://api.mapy.com; worker-src 'self' blob:; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # the demo runs behind HTTPS (Cloudflare); start short and raise once nothing breaks
        add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
