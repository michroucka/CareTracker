name: CareTracker

services:
  # Backend - Spring Boot
  backend:
    container_name: caretracker-backend
    image: caretracker-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/caretracker
      SPRING_DATASOURCE_USERNAME: caretracker
      SPRING_DATASOURCE_PASSWORD: caretracker
    depends_on:
      - db

  # Frontend - React build served by Nginx
  frontend:
    container_name: caretracker-frontend
    image: caretracker-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8080/api

  # PostgreSQL database
  db:
    container_name: caretracker-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: caretracker
      POSTGRES_PASSWORD: caretracker
      POSTGRES_DB: caretracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # PgAdmin - web interface for PostgreSQL
  pgadmin:
    container_name: caretracker-pgadmin
    image: dpage/pgadmin4
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@caretracker.cz
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin_data:
