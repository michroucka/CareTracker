name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unit tests (*Test), integration tests (*IT, PostgreSQL via Testcontainers) and JaCoCo report
      - name: Build and test
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always() && hashFiles('backend/target/site/jacoco/jacoco.csv') != ''
        run: python3 ../.github/scripts/coverage_summary.py jacoco target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run coverage

      - name: Coverage summary
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        run: python3 ../.github/scripts/coverage_summary.py vitest coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  e2e:
    name: E2E
    # Slower than the other jobs, so only for pull requests into main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start the app
        run: make e2e-up

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Backend log on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs backend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
