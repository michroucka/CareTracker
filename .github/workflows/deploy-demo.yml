name: Deploy Demo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, caretracker-demo]
    steps:
      - uses: actions/checkout@v5

      - name: Deploy demo stack
        env:
          COMPOSE_FILE: docker-compose.demo.yml
        run: |
          set -e
          compose() { docker compose --env-file "$HOME/caretracker-secrets/.env.demo" "$@"; }
          compose pull cloudflared
          compose build --pull
          compose up -d

      - name: Clean up dangling images
        run: docker image prune -f
