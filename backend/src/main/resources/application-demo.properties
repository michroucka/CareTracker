# Demo profile – overrides base application.properties

# Disable mail autoconfiguration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.mail.username=noreply@demo.caretracker.cz

# Allow Flyway clean for nightly reset
spring.flyway.clean-disabled=false

# Demo app URL
app.frontend.url=https://demo.caretracker.cz

# Disable DevTools
spring.devtools.restart.enabled=false

# Quieter logging
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.cz.zcu.kiv.caretracker=INFO