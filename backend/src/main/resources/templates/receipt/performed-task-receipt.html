<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <style>
            body { font-family: Nunito, ui-sans-serif, system-ui, sans-serif; font-size: 12px; padding: 0 16px 0 16px; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
            h1 { text-align: center; }
            h2, h3, h4 { margin: 8px 0 8px 0; }
            .left { float: left; }
            .right { float: right; }
            .clearfix::after { content: ""; display: table; clear: both; }
            .mt-4 { margin-top: 12px; }
            .client-table { margin-bottom: 12px; }
            .client-table td { background: #f9f9f9; }
            .client-name { font-size: 15px; font-weight: bold; }
            .client-meta { font-size: 11px; color: #555; }
            .signature-table { margin-top: 64px; border: none; }
            .signature-table td { border: none; width: 33%; padding: 0; }
            .signature-dots { font-size: 14px; letter-spacing: 2px; text-align: center; }
            .signature-label { font-size: 11px; margin-top: 2px; text-align: center; }
        </style>
    </head>
    <body>
        <h1 th:text="${organizationName}">Nazev organizace</h1>
        <table class="client-table">
            <tr>
                <td colspan="2"><span class="client-name" th:text="${clientName}">Jmeno Prijmeni</span></td>
            </tr>
            <tr>
                <td><span class="client-meta">Datum narození: </span><span class="client-meta" th:text="${clientDateOfBirth}">1.1.1970</span></td>
                <td><span class="client-meta">Osobní číslo: </span><span class="client-meta" th:text="${clientPersonalNumber}">12345</span></td>
            </tr>
            <tr>
                <td colspan="2"><span class="client-meta">Adresa: </span><span class="client-meta" th:text="${clientAddress}">Ulice, PSC, Mesto</span></td>
            </tr>
        </table>
        <div class="clearfix">
            <h3 class="left" th:text="${monthYear}">Leden 2026</h3>
            <h3 class="right" th:text="${departmentName}">Oddeleni</h3>
        </div>
        <h4>Provedené úkony</h4>
        <table>
            <thead>
                <tr>
                    <th>Název úkonu</th>
                    <th>Počet</th>
                    <th>Cena</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.taskName}">nazev</td>
                    <td th:text="${task.unitCount + ' ' + task.unitType}">pocet</td>
                    <td th:text="${task.price + ' Kč'}">cena</td>
                </tr>
            </tbody>
        </table>
        <h3 class="mt-4 right">Celkem: <span th:text="${totalPrice}">0</span> Kč</h3>
        <table class="signature-table">
            <tr>
                <td><div class="signature-dots">.....................</div><div class="signature-label">Datum</div></td>
                <td><div class="signature-dots">.....................</div><div class="signature-label">Převzal</div></td>
                <td><div class="signature-dots">.....................</div><div class="signature-label">Podpis</div></td>
            </tr>
        </table>
    </body>
</html>
