# Integration test profile. Datasource comes from the Testcontainers PostgreSQL container (@ServiceConnection).

# Hibernate checks at startup that the entities match the schema built by the Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# ListQueryCountIT counts SQL statements per request
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# Values normally in secrets.properties (not present in CI). Mail and geocoding are mocked in tests.
spring.mail.username=noreply@caretracker.test
app.mapy.api-key=test-key
app.frontend.url=http://localhost:3000

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

logging.level.root=WARN
logging.level.cz.zcu.kiv.caretracker=INFO
logging.level.org.springframework.security=WARN
app.remember-me.key=test-remember-me-key
